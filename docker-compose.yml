# Mitoyen — n8n (orchestration) + moteur (Python/FastAPI)
#
#   cp .env.example .env      # puis remplir les valeurs
#   docker compose up -d --build
#
#   n8n     → http://localhost:5678
#   moteur  → joignable par n8n sur http://moteur:8000 (réseau interne)
#             et, pour tes tests, sur http://localhost:8000/docs

services:
  moteur:
    build:
      context: .
      dockerfile: moteur/Dockerfile
    restart: unless-stopped
    environment:
      MOTEUR_TOKEN: ${MOTEUR_TOKEN:?Définis MOTEUR_TOKEN dans .env}
      MOTEUR_CONFIG_DIR: /app/config
      MOTEUR_OUT_DIR: /app/out
      MOTEUR_DATA_DIR: /app/data
      MOTEUR_URL_PUBLIQUE: ${MOTEUR_URL_PUBLIQUE:-http://localhost:8000}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium-latest}
      INTERFACE_MOT_DE_PASSE: ${INTERFACE_MOT_DE_PASSE:-}
      INTERFACE_HTTPS: ${INTERFACE_HTTPS:-0}
    volumes:
      - ./config:/app/config:ro     # fiches des copros, en lecture seule
      - ./out:/app/out              # avis et récaps générés
      - ./data:/app/data            # dossiers de travaux et devis
    ports:
      - "127.0.0.1:8000:8000"       # accessible depuis ta machine uniquement
    networks: [interne]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      moteur:
        condition: service_healthy
    environment:
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Définis N8N_ENCRYPTION_KEY dans .env}
      # URL publique utilisée dans les boutons « Valider / Annuler » des mails
      WEBHOOK_URL: ${N8N_URL_PUBLIQUE:-http://localhost:5678/}
      # En local sans HTTPS uniquement ; à retirer derrière un reverse proxy HTTPS
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [interne]

networks:
  interne:

volumes:
  n8n_data:
