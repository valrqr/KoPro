# Fonds de travaux : cotisation annuelle, au moins 5 % du budget prévisionnel
fonds_travaux:
  cle: generales
  cotisation_annuelle: 1200

# Seuils votés en AG (montants TTC, en euros). Ils servent à aiguiller chaque
# dossier de travaux vers le bon circuit de décision.
seuils:
  consultation_conseil_syndical: 1500   # au-delà, le conseil syndical doit être consulté
  mise_en_concurrence: 3000             # au-delà, plusieurs devis sont obligatoires
  delegation_conseil_syndical:          # délégation de pouvoirs (art. 21-1 loi 1965)
    active: false                       # true si l'AG l'a votée
    plafond_par_depense: null           # montant maximum par dépense, fixé par l'AG

# -----------------------------------------------------------------------------
# 9. Appels de fonds
# -----------------------------------------------------------------------------
appels_de_fonds:
  periodicite: trimestrielle
  dates_exigibilite: ["01-01", "04-01", "07-01", "10-01"]   # MM-JJ
  envoi_jours_avant: 21                                      # avis envoyé 3 semaines avant
  compte_separe:                                             # compte bancaire du syndicat
    titulaire: "Syndicat des copropriétaires Résidence Les Mimosas"
    iban: "FR76 0000 0000 0000 0000 0000 000"                # fictif
    bic: "EXEMFRPPXXX"                                       # fictif
  reference_virement: "MIMOSAS-{exercice}-T{trimestre}-{coproprietaire}"

# -----------------------------------------------------------------------------
# 10. Diagnostics et obligations suivis par l'échéancier
# -----------------------------------------------------------------------------
diagnostics:
  - { id: pppt,  libelle: "Projet de plan pluriannuel de travaux", realise_le: null,       validite_ans: 10 }
  - { id: dtg,   libelle: "Diagnostic technique global",            realise_le: null,       validite_ans: 10 }
  - { id: amiante, libelle: "Dossier technique amiante",            realise_le: 2019-05-14, validite_ans: null }

